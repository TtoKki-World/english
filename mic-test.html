<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이크 시험</title>
<style>
  body { font: 16px/1.5 sans-serif; margin: 16px; color: #222; }
  button { display: block; width: 100%; padding: 14px; margin: 8px 0; font-size: 16px; }
  .say { background: #eef3fb; padding: 12px; font-size: 18px; font-weight: bold; }
  .box { border: 1px solid #ccc; padding: 8px; margin: 8px 0; }
  .sub { color: #666; font-size: 13px; word-break: break-all; }
  audio { width: 100%; }
</style>
</head>
<body>
<h3>채점 + 내 목소리 동시 시험</h3>
<p>버튼을 위에서부터 하나씩 누르고, 누를 때마다 아래 문장을 말해 주세요. 다 끝나면 화면 전체를 캡처해서 보내 주세요.</p>
<div class="say">I am going to the store</div>
<div id="btns"></div>
<div id="out"></div>
<p class="sub" id="ua"></p>
<script>
(function () {
  const Recog = window.SpeechRecognition || window.webkitSpeechRecognition;
  const OFF = { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } };
  const ON = { audio: true };
  // first: 'mic'은 녹음을 먼저, 'rec'은 음성 인식을 먼저 시작 / track: 녹음용 마이크 음성을 인식에 직접 넘김
  const TESTS = [
    { name: '1번 (예전 방식)', first: 'mic', cons: ON },
    { name: '2번', first: 'mic', cons: OFF },
    { name: '3번', first: 'rec', cons: ON },
    { name: '4번', first: 'rec', cons: OFF },
    { name: '5번', first: 'mic', cons: ON, track: true }
  ];
  const btns = document.getElementById('btns'), out = document.getElementById('out');
  document.getElementById('ua').textContent = navigator.userAgent;
  let busy = false;

  function peak(blob) {
    const C = window.AudioContext || window.webkitAudioContext;
    const ctx = new C();
    return blob.arrayBuffer().then(b => ctx.decodeAudioData(b)).then(buf => {
      const d = buf.getChannelData(0);
      let p = 0;
      for (let i = 0; i < d.length; i++) p = Math.max(p, Math.abs(d[i]));
      ctx.close();
      return Math.round(p * 100) + '%';
    }).catch(() => '측정 불가');
  }

  function run(t, btn) {
    if (busy) return;
    busy = true;
    const box = document.createElement('div');
    box.className = 'box';
    box.innerHTML = '<b>' + t.name + '</b>: 듣는 중… 지금 말해 주세요';
    out.prepend(box);

    let heard = '', err = '', stream = null, mr = null, recEnded = false, finished = false;
    const chunks = [];
    const rec = new Recog();
    rec.lang = 'en-US';
    rec.interimResults = false;

    function finish() {
      if (finished) return;
      finished = true;
      clearTimeout(limit);
      const done = () => {
        if (stream) stream.getTracks().forEach(tr => tr.stop());
        const blob = chunks.length ? new Blob(chunks, { type: mr.mimeType }) : null;
        (blob ? peak(blob) : Promise.resolve('-')).then(p => {
          box.innerHTML = '<b>' + t.name + '</b><br>인식: ' + (heard ? '<b>' + heard.replace(/</g, '&lt;') + '</b>' : '없음') +
            (err ? ' (' + err + ')' : '') + '<br>녹음: ' + (blob ? Math.round(blob.size / 1024) + 'KB, 소리 크기 ' + p : '없음');
          if (blob) {
            const a = document.createElement('audio');
            a.controls = true;
            a.src = URL.createObjectURL(blob);
            box.appendChild(a);
          }
          busy = false;
        });
      };
      if (mr && mr.state !== 'inactive') { mr.onstop = done; mr.stop(); } else done();
    }
    const limit = setTimeout(() => { err = err || '시간 초과'; try { rec.abort(); } catch (e) { /* 이미 종료됨 */ } finish(); }, 12000);

    function startMic() {
      return navigator.mediaDevices.getUserMedia(t.cons).then(s => {
        stream = s;
        mr = new MediaRecorder(s);
        mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        mr.start(250);
        if (recEnded) setTimeout(finish, 300);
      }).catch(e => { err = '마이크: ' + e.name; if (recEnded) finish(); });
    }
    function startRec() {
      try {
        if (t.track) rec.start(stream.getAudioTracks()[0]);
        else rec.start();
      } catch (e) { err = '시작: ' + e.name; recEnded = true; finish(); }
    }

    rec.onresult = e => { heard = e.results[0][0].transcript; };
    rec.onerror = e => { err = e.error; };
    rec.onend = () => { recEnded = true; setTimeout(finish, 300); };

    if (t.first === 'mic') startMic().then(startRec);
    else {
      let micOn = false;
      const once = () => { if (!micOn) { micOn = true; startMic(); } };
      rec.onaudiostart = once;
      setTimeout(once, 1500); // audiostart가 오지 않는 기기 대비
      startRec();
    }
  }

  if (!Recog) btns.textContent = '이 브라우저는 음성 인식을 지원하지 않습니다. 크롬에서 열어 주세요.';
  else TESTS.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t.name + ' 시험';
    b.onclick = () => run(t, b);
    btns.appendChild(b);
  });
})();
</script>
</body>
</html>
